name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile main.py user.py sqliter.py config.py updater.py login.py bump_version.py

      - name: Run pytest
        env:
          TOKEN: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
          API_ID: "12345"
          API_HASH: dummy-hash-for-tests
        run: |
          python -m pytest tests/ -q
